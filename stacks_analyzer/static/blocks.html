<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stacks Analyzer Blocks</title>
  <link rel="stylesheet" href="/static/history.css" />
  <link rel="stylesheet" href="/static/blocks.css" />
  <style>
    .blocks-controls {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 10px;
      align-items: end;
    }
    .blocks-controls .control-group {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px;
      align-items: end;
    }
    .blocks-controls .control-group label {
      grid-column: 1 / -1;
    }
    .blocks-controls input[type="number"] {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.62);
      color: #dbeafe;
      padding: 8px 10px;
      width: 100%;
      font-variant-numeric: tabular-nums;
    }
    .blocks-controls .latest-group {
      display: flex;
      gap: 8px;
      align-items: end;
    }
    .pager {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .pager .muted {
      font-variant-numeric: tabular-nums;
    }
    .pager-buttons {
      display: flex;
      gap: 8px;
    }
    button[disabled] {
      opacity: 0.45;
      cursor: default;
    }
    .filter-chip {
      display: inline-block;
      border: 1px solid rgba(56, 189, 248, 0.45);
      background: rgba(56, 189, 248, 0.14);
      color: #bae6fd;
      border-radius: 999px;
      padding: 2px 10px;
      font-size: 12px;
      margin-left: 8px;
    }
    .filter-chip a {
      color: inherit;
      text-decoration: none;
      margin-left: 6px;
      opacity: 0.8;
    }
    .filter-chip a:hover { opacity: 1; }
    @media (max-width: 980px) {
      .blocks-controls {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div>
        <h1>Stacks Analyzer Blocks</h1>
        <div class="muted" id="boundsLabel">Loading stored blocks...</div>
      </div>
      <div class="header-actions">
        <a class="header-link" href="/">Live Dashboard</a>
        <a class="header-link" href="/history">History</a>
        <div class="muted" id="updated">Waiting for data...</div>
      </div>
    </div>

    <div class="card blocks-controls">
      <div class="control-group">
        <label for="stxHeightInput">Stacks block height</label>
        <input id="stxHeightInput" type="number" min="0" step="1" placeholder="e.g. 6398581" />
        <button type="button" id="stxHeightGo">Look up</button>
      </div>
      <div class="control-group">
        <label for="btcHeightInput">Bitcoin block height</label>
        <input id="btcHeightInput" type="number" min="0" step="1" placeholder="e.g. 934988" />
        <button type="button" id="btcHeightGo">Look up</button>
      </div>
      <div class="latest-group">
        <button type="button" id="latestBtn">Latest</button>
      </div>
    </div>

    <div class="card">
      <div class="panel-title">
        <span id="tableTitle">Latest Blocks</span>
        <span id="filterChip"></span>
      </div>
      <div id="blocksTable"><div class="muted">Loading...</div></div>
      <div class="bf-legend" id="blocksLegend"></div>
      <div class="pager">
        <span class="muted" id="pageLabel"></span>
        <div class="pager-buttons">
          <button type="button" id="newerBtn">&larr; Newer</button>
          <button type="button" id="olderBtn">Older &rarr;</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/blocks.js"></script>
  <script src="/static/blocks_page.js"></script>
</body>
</html>
